spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Vehicle Service
spring.cloud.gateway.server.webflux.routes[0].id=vehicle-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://VEHICLE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/vehicles/**

# Trip Service
spring.cloud.gateway.server.webflux.routes[1].id=trip-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://TRIP-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/trips/**

# Maintenance Service
spring.cloud.gateway.server.webflux.routes[2].id=maintenance-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://MAINTENANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/maintenance/**
# Auth Service
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**
eureka.instance.instance-id=localhost:${server.port}
